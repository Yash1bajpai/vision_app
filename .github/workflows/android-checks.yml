name: Android checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        shell: bash
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test, build and lint
        shell: bash
        run: |
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          if [ "$RUNNER_OS" = "Windows" ]; then AAPT2="$AAPT2.exe"; fi
          gradle "-Pandroid.aapt2FromMavenOverride=$AAPT2" testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Save reports and debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.os }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
