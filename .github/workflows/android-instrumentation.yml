name: Android emulator safety checks

on:
  push:
    branches: [main, 'feature/android-production-checks']
    paths: ['.github/workflows/android-instrumentation.yml', 'app/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/android-instrumentation.yml', 'app/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-safety-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-safety-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-28;default;x86_64 ndk;26.1.10909125'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Boot headless emulator and run Android safety instrumentation
        timeout-minutes: 33
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          stage() { echo "[stage $(date -u +%H:%M:%S)] $*"; }

          stage "check hardware acceleration"
          ls -l /dev/kvm
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          # avdmanager and emulator versions disagree on default home discovery.
          # Give both tools the same explicit AVD root and fail before boot if absent.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/vision-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name vision_preference_test \
            --path "$ANDROID_AVD_HOME/vision_preference_test.avd" --package 'system-images;android-28;default;x86_64'

          test -s "$ANDROID_AVD_HOME/vision_preference_test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee emulator-evidence/avd-list.txt
          grep -qx vision_preference_test emulator-evidence/avd-list.txt

          stage "start emulator"
          # swiftshader_indirect is the supported software GPU; plain swiftshader is not.
          # -qemu -cpu host (KVM passthrough) so the guest exposes the host's
          # real ISA; the default virtual CPU model masks AVX2/FMA/BMI2, which
          # kept the scoped SIMD diagnostic from ever engaging. -cpu is a QEMU
          # option, not an emulator-wrapper option: per the emulator command
          # line documentation it must follow -qemu, and -qemu must be the LAST
          # wrapper argument (everything after it is QEMU-specific). The
          # guest-ISA gate below re-verifies the six features and falls back to
          # the baseline scalar build on any host whose guest still lacks them.
          "$ANDROID_HOME/emulator/emulator" -avd vision_preference_test \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -feature -Vulkan \
            -camera-back none -camera-front none -memory 3072 -partition-size 4096 \
            -qemu -cpu host \
            > emulator-evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!

          # Every command here is bounded. An unbounded adb call on a device-less
          # server blocks forever and hides the real failure behind a step timeout.
          cleanup() {
            echo "===== emulator-evidence/emulator.log ====="
            cat emulator-evidence/emulator.log 2>/dev/null || true
            timeout -k 5 30 adb pull /sdcard/Android/data/com.vision.app/files/. emulator-evidence/ 2>/dev/null || true
            echo "===== adb devices ====="
            timeout -k 5 30 adb devices -l || true
            echo "===== logcat tail ====="
            timeout -k 5 60 adb logcat -d 2>/dev/null | tail -n 80 || true
            echo "===== VisionLlama/RealModelSmoke logcat ====="
            timeout -k 5 60 adb logcat -d 2>/dev/null | grep -iE "VisionLlama|RealModelSmoke" | tail -n 200 || true
            timeout -k 5 30 adb emu kill || true
            kill "$EMULATOR_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          stage "wait for emulator to appear in adb"
          seen=0
          for _ in $(seq 1 50); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "emulator process exited before adb listed it"
              exit 1
            fi
            if timeout -k 5 15 adb devices 2>/dev/null | grep -q '^emulator-'; then seen=1; break; fi
            sleep 3
          done
          if [ "$seen" != 1 ]; then
            echo "emulator never appeared in adb within 150s"
            exit 1
          fi
          stage "emulator visible to adb"

          timeout -k 5 30 adb wait-for-device
          stage "wait for boot_completed"
          timeout -k 10 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          stage "device booted"
          timeout -k 5 30 adb devices -l

          stage "disable animations and record device fingerprint"
          timeout -k 5 30 adb shell settings put global window_animation_scale 0
          timeout -k 5 30 adb shell settings put global transition_animation_scale 0
          timeout -k 5 30 adb shell settings put global animator_duration_scale 0
          { adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
          } | tr -d '\r' > emulator-evidence/android-version.txt
          cat emulator-evidence/android-version.txt

          stage "verify emulator guest ISA for scoped SIMD diagnostic"
          # The scoped x86_64 SIMD build (VISION_CI_X86_SIMD, see
          # app/src/main/cpp/CMakeLists.txt) is enabled ONLY when the emulator
          # guest actually exposes the features; otherwise the run keeps the
          # baseline scalar config instead of risking SIGILL.
          timeout -k 5 30 adb shell cat /proc/cpuinfo | tr -d '\r' > emulator-evidence/cpuinfo.txt || true
          SIMD_GRADLE_ARGS=""
          # The CMake block enables SSE4.2/AVX/AVX2/FMA/F16C/BMI2, so the gate
          # must verify ALL of them in the guest - AVX2 alone does not entail
          # BMI2 or the rest; a partial match keeps the baseline scalar build.
          if grep -qw sse4_2 emulator-evidence/cpuinfo.txt && grep -qw avx emulator-evidence/cpuinfo.txt && grep -qw avx2 emulator-evidence/cpuinfo.txt && grep -qw fma emulator-evidence/cpuinfo.txt && grep -qw f16c emulator-evidence/cpuinfo.txt && grep -qw bmi2 emulator-evidence/cpuinfo.txt; then
            echo "guest exposes sse4_2/avx/avx2/fma/f16c/bmi2: enabling scoped x86_64 SIMD diagnostic"
            SIMD_GRADLE_ARGS="-PvisionCiX86Simd"
          else
            echo "guest lacks one or more of sse4_2/avx/avx2/fma/f16c/bmi2: keeping baseline scalar native config"
          fi

          stage "run instrumentation"
          # --console=plain keeps Gradle line-buffered; the outer timeout turns a
          # wedged device or main looper into a fast failure instead of a silent hang.
          timeout -k 30 1200 gradle --console=plain \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/34.0.0/aapt2" \
            $SIMD_GRADLE_ARGS \
            connectedDebugAndroidTest
          stage "instrumentation finished"

          stage "pull screenshot evidence"
          timeout -k 5 30 adb pull /sdcard/Android/data/com.vision.app/files/. emulator-evidence/ 2>/dev/null || true
          timeout -k 5 30 adb pull /storage/emulated/0/Android/data/com.vision.app/files/. emulator-evidence/ 2>/dev/null || true
      - name: Upload emulator diagnostics and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: emulator-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Print test evidence without stored artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          suites = [ET.parse(path).getroot() for path in paths]
          total = sum(int(s.get('tests', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          print('Android instrumentation:', total, 'tests;', failures, 'failures/errors')
          for suite in suites:
              for case in suite.iter('testcase'):
                  print(case.get('classname'), case.get('name'), 'FAILED' if case.find('failure') is not None or case.find('error') is not None else 'passed')
          if total != 33 or failures or skipped:
              raise SystemExit('Expected exactly thirty-three passing Android safety instrumentation tests')
          PYTHON
          cat emulator-evidence/android-version.txt
